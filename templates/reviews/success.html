{% extends 'base.html' %}

{% block title %}Отзыв отправлен — ПолиФорм{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto text-center py-16">
    <div class="w-20 h-20 mx-auto rounded-full bg-green-100 text-green-600 flex items-center justify-center text-4xl font-bold mb-6">
        ✓
    </div>
    <h1 class="text-3xl font-bold mb-3">Спасибо за отзыв!</h1>
    <p class="text-gray-600 mb-8">
        Ваш отзыв отправлен на модерацию. После проверки он появится на сайте.
    </p>

    <div class="flex justify-center gap-3">
        <a href="{% url 'reviews:list' %}"
           class="px-6 py-3 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition">
            К отзывам
        </a>
        <a href="{% url 'catalog:list' %}"
           class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            В каталог
        </a>
    </div>
</div>

{% endblock %}
