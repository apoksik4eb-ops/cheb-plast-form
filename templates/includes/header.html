<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="container mx-auto px-4 max-w-7xl">
        <div class="flex items-center justify-between h-16 gap-6">

            <a href="{% url 'pages:home' %}" class="flex items-center gap-2 shrink-0">
                <span class="w-10 h-10 rounded-lg bg-brand-600 text-white flex items-center justify-center font-bold text-lg">ПФ</span>
                <span class="font-bold text-xl text-gray-900 hidden sm:block">ПолиФорм</span>
            </a>

            <nav class="hidden lg:flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'pages:home' %}" class="text-gray-700 hover:text-brand-600 transition">Главная</a>
                <a href="{% url 'catalog:list' %}" class="text-gray-700 hover:text-brand-600 transition">Каталог</a>
                <a href="{% url 'pages:about' %}" class="text-gray-700 hover:text-brand-600 transition">О компании</a>
                <a href="{% url 'reviews:list' %}" class="text-gray-700 hover:text-brand-600 transition">Отзывы</a>
                <a href="{% url 'pages:contacts' %}" class="text-gray-700 hover:text-brand-600 transition">Контакты</a>
            </nav>

            <div class="flex items-center gap-2">
                <a href="{% url 'orders:cart_detail' %}"
                   class="relative px-3 py-2 text-sm text-gray-700 hover:text-brand-600 transition">
                    🛒 <span class="hidden sm:inline">Корзина</span>
                    {% if cart|length %}
                        <span class="absolute top-1 right-1 bg-red-500 rounded-full w-2.5 h-2.5"></span>
                    {% endif %}
                </a>

                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard:home' %}"
                       class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Кабинет
                    </a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition">
                            Выйти
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}"
                       class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        Войти
                    </a>
                    <a href="{% url 'accounts:register' %}"
                       class="px-4 py-2 text-sm bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition">
                        Регистрация
                    </a>
                {% endif %}
            </div>

        </div>
    </div>
</header>
