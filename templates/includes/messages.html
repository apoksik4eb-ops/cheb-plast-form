{% if messages %}
<div class="container mx-auto px-4 max-w-7xl mt-4 space-y-2">
    {% for message in messages %}
        <div class="px-4 py-3 rounded-lg border
            {% if message.tags == 'success' %}bg-green-50 border-green-200 text-green-800
            {% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-200 text-yellow-800
            {% elif message.tags == 'danger' %}bg-red-50 border-red-200 text-red-800
            {% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
