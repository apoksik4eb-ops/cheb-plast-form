{% if page.has_other_pages %}
<nav class="flex items-center justify-center gap-4 mt-8">
    {% if page.has_previous %}
        <a href="?page={{ page.previous_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
           class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            ← Назад
        </a>
    {% endif %}

    <span class="text-sm text-gray-600">
        Страница {{ page.number }} из {{ page.paginator.num_pages }}
    </span>

    {% if page.has_next %}
        <a href="?page={{ page.next_page_number }}{% if request.GET.q %}&q={{ request.GET.q }}{% endif %}"
           class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
            Вперёд →
        </a>
    {% endif %}
</nav>
{% endif %}
